name: Ping Slack
description: Send a deployment notification state update to Slack
inputs:
  state:
    description: The current state (from GithubActionsEventState)
    required: true
  lambda-url:
    description: The URL to the related Slack Notifier lambda
    required: true
  api-secret:
    description: The secret handshake to allow communication with the lambda
    required: true
  previous-sha:
    description: |
      For "STARTED" state, and "FAILED" state of a group other than "production", the sha version of the current
      running app before the new deployment. This gives a list of changelogs in the Slack message.
    required: false
  group:
    description: |
      "staging" or "production". Shares one Slack message per commit between every environment of the same group.
      Without it, each environment posts its own message.
    required: false
  initiator:
    description: GitHub login of the person behind the deployment (who merged the pull request, or who launched it)
    required: false
  initiator-email:
    description: Email of the initiator, used to mention them on Slack when a deployment or a release fails
    required: false
  release-url:
    description: For "RELEASE_PUBLISHED" state, the URL of the published GitHub release
    required: false
  release-name:
    description: For "RELEASE_PUBLISHED" state, the name of the published GitHub release
    required: false
runs:
  using: node20
  main: dist/index.js
